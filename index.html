.program-progress{
  background:linear-gradient(135deg,#FCFAF7,#F3EDE4);
  border:1px solid #DDD2C2;
  position:relative;
  overflow:hidden;
}

.program-progress:before{
  content:'';
  position:absolute;
  width:90px;
  height:90px;
  border:1px solid rgba(199,181,141,.28);
  border-radius:50%;
  right:-32px;
  top:-35px;
}

.program-kicker{
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#8A8175;
  margin-bottom:8px;
}

.program-name{
  font-family:Georgia,'Times New Roman',serif;
  font-size:21px;
  line-height:1.15;
  color:var(--ink);
  margin-bottom:14px;
}

.program-session{
  display:flex;
  align-items:baseline;
  gap:7px;
  margin-bottom:14px;
}

.program-session-current{
  font-family:Georgia,'Times New Roman',serif;
  font-size:38px;
  line-height:1;
  color:var(--ink);
}

.program-session-total{
  font-size:13px;
  color:#77736B;
}

.progress-track{
  width:100%;
  height:6px;
  background:#E7E0D6;
  border-radius:999px;
  overflow:hidden;
  margin:8px 0 9px;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#B8A47B,#D6C49E);
  border-radius:999px;
}

.progress-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:10px;
  color:#77736B;
}

.progress-message{
  margin-top:14px!important;
  padding-top:13px;
  border-top:1px solid #E5DDD2;
  font-family:Georgia,'Times New Roman',serif;
  font-size:14px!important;
  color:#514B45!important;
}

  function programProgressHTML(d){

  if(
    d.experience_type !== 'PROGRAM_SESSION' ||
    !d.program_session_number ||
    !d.program_total_sessions
  ){
    return '';
  }

  const current =
    Number(d.program_session_number);

  const total =
    Number(d.program_total_sessions);

  const safeCurrent =
    Math.min(
      Math.max(current,1),
      total
    );

  const percentage =
    Math.round(
      (safeCurrent / total) * 100
    );

  const remainingAfter =
    Math.max(
      total - safeCurrent,
      0
    );

  const programName =
    d.program_name ||
    d.treatment ||
    'Tu programa ONÍRIKA';

  let message;

  if(safeCurrent >= total){

    message =
      `✦ Has llegado a la última sesión de esta etapa de tu experiencia ONÍRIKA.`;

  }else if(remainingAfter === 1){

    message =
      `Al completar esta sesión te quedará 1 sesión de tu programa.`;

  }else{

    message =
      `Al completar esta sesión te quedarán ${remainingAfter} sesiones de tu programa.`;
  }

  return `

function b64encode(str){return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(m,p1)=>String.fromCharCode('0x'+p1)))}

<div class="actions"><a href="#" onclick="addCalendar(event,'${esc(d.date)}','${esc(d.time)}','${esc(d.treatment)}')">Añadir al calendario</a><a class="dark" target="_blank" href="https://wa.me/${CONFIG.whatsapp}?text=${reMsg}">Reprogramar cita<br>por WhatsApp</a><a class="dark" target="_blank" href="https://wa.me/${CONFIG.whatsapp}?text=${caMsg}">Cancelar cita<br>por WhatsApp</a></div><div class="private">🔒 Enlace privado e intransferible</div><div class="footer"><div class="brand">ONÍRIKA</div><div class="brand-sub">CLÍNICA MÉDICO-ESTÉTICA <span>·</span> VALENCIA</div></div>
</div></div>`}
function addCalendar(e,date,time,treatment){e.preventDefault();const start=new Date(`${date}T${time}:00`);const end=new Date(start.getTime()+60*60*1000);const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const text=encodeURIComponent(`ONÍRIKA · ${treatment}`);const dates=fmt(start)+'/'+fmt(end);window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${dates}&location=${encodeURIComponent(CONFIG.address)}`,'_blank')}
function makeId(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
function generatorHTML(){return `<div class="shell"><div class="tool-head"><div class="kicker">ONÍRIKA APPOINTMENT EXPERIENCE · OAE-01</div><div class="brand">ONÍRIKA</div><div class="brand-sub">CLÍNICA MÉDICO-ESTÉTICA <span>·</span> VALENCIA</div><h1>Generador de confirmaciones</h1><p>Rellena la cita, genera el enlace y abre WhatsApp con el mensaje preparado.</p></div><div class="workspace"><aside class="panel form-panel"><h2>Nueva confirmación</h2><div class="intro">La dirección, Google Maps, Parking del Palau y la política de cancelación ya quedan configurados por defecto.</div>
<div class="field"><label>Nombre de la paciente</label><input id="name" value="María López"></div><div class="grid2"><div class="field"><label>Fecha</label><input id="date" type="date" value="2026-08-18"></div><div class="field"><label>Hora</label><input id="time" type="time" value="11:30"></div></div><div class="field"><label>Tratamiento</label><select id="treatment">${TREATMENT_OPTIONS.map(x=>`<option value="${x}"${x==='INDIBA PORCELAIN SKIN'?' selected':''}>${x}</option>`).join('')}</select><div id="treatmentCategory" class="subvalue" style="margin:7px 2px 0;text-transform:uppercase;letter-spacing:.12em;color:#8a8781;font-size:10px">${treatmentCategory('INDIBA PORCELAIN SKIN')}</div></div><div class="grid2"><div class="field"><label>Profesional</label><input id="professional" value="Elsa"></div><div class="field"><label>Duración</label><input id="duration" value="60 minutos"></div></div><div class="field"><label>Indicaciones especiales</label><textarea id="instructions">${precareFor('INDIBA PORCELAIN SKIN').join('\n')}</textarea></div><button class="primary" onclick="generate()">Generar confirmación</button><button class="secondary" onclick="resetDemo()">Restablecer ejemplo</button><div id="result" class="result hidden"><div class="lab">URL de producción</div><div class="urlbox"><code id="prodUrl"></code><button class="copy" onclick="copyText('prodUrl')">⧉</button></div><div class="wa-preview" id="waText"></div><button class="primary" style="margin-top:10px" onclick="openWhatsApp()">Abrir WhatsApp con mensaje</button><button class="secondary" onclick="openClient()">Abrir vista de la clienta</button><div class="note">Esta URL es corta y real: la cita queda guardada de forma segura y el enlace solo lleva un código de referencia. Los botones de reprogramar/cancelar en la vista de la clienta escriben directo al WhatsApp de la clínica (${CONFIG.whatsapp.replace(/^34/,'+34 ')}).</div></div></aside><main id="preview"></main></div></div>`}
let generated=null;
function vals(){return {name:document.getElementById('name').value.trim()||'Cliente',date:document.getElementById('date').value,time:document.getElementById('time').value,treatment:document.getElementById('treatment').value.trim(),professional:document.getElementById('professional').value.trim(),duration:document.getElementById('duration').value.trim(),instructions:document.getElementById('instructions').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).join('|'),id:generated?.id||'J8KL42'}}
function live(){if(!document.getElementById('preview'))return;document.getElementById('preview').innerHTML=clientHTML(vals())}
function packedParam(d){const short={n:d.name,dt:d.date,t:d.time,tr:d.treatment,p:d.professional,du:d.duration,i:d.instructions,id:d.id};const compressed=LZString.compressToEncodedURIComponent(JSON.stringify(short));return new URLSearchParams({c:compressed})}
async function saveToBackend(d){const r=await fetch('/.netlify/functions/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error('save_failed');const{id}=await r.json();return id}
async function generate(){const d=vals();generated=d;const btn=document.querySelector('.primary');if(btn)btn.textContent='Generando…';let prod;try{const shortId=await saveToBackend(d);d.id=shortId;prod=`${location.origin}${location.pathname}?id=${shortId}`}catch(e){d.id=makeId();prod=`${location.origin}${location.pathname}?${packedParam(d).toString()}`}if(btn)btn.textContent='Generar confirmación';generated=d;const msg=`Hola ${firstName(d.name)}, tu cita en ONÍRIKA está confirmada.\nHemos preparado toda la información de tu visita aquí:\n${prod}`;document.getElementById('prodUrl').textContent=prod;document.getElementById('waText').textContent=msg;document.getElementById('result').classList.remove('hidden');live();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function openClient(){if(!generated)return generate().then(openClient);const d=generated;const u=d.id&&d.id.length===7?location.pathname+'?id='+d.id:location.pathname+'?'+packedParam(d).toString();window.open(u,'_blank')}
function openWhatsApp(){if(!generated)generate();const txt=document.getElementById('waText').textContent;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
async function copyText(id){const t=document.getElementById(id).textContent;try{await navigator.clipboard.writeText(t);alert('Enlace copiado')}catch(e){prompt('Copia el enlace:',t)}}
function resetDemo(){document.getElementById('name').value='María López';document.getElementById('date').value='2026-08-18';document.getElementById('time').value='11:30';document.getElementById('treatment').value='INDIBA PORCELAIN SKIN';document.getElementById('professional').value='Elsa';document.getElementById('duration').value='60 minutos';document.getElementById('instructions').value=precareFor('INDIBA PORCELAIN SKIN').join('\n');const cat=document.getElementById('treatmentCategory');if(cat)cat.textContent=treatmentCategory('INDIBA PORCELAIN SKIN');generated=null;document.getElementById('result').classList.add('hidden');live()}
async function init(){if(isClient){const id=qs.get('id');if(id){document.getElementById('app').innerHTML=loadingHTML();try{const d={...defaults,...await fetchById(id)};document.getElementById('app').innerHTML='<div class="client-only">'+clientHTML(d,true)+'</div>'}catch(e){document.getElementById('app').innerHTML=notFoundHTML()}}else{document.getElementById('app').innerHTML='<div class="client-only">'+clientHTML(getData(),true)+'</div>'}}else{document.getElementById('app').innerHTML=generatorHTML();document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',live));const treatment=document.getElementById('treatment');if(treatment)treatment.addEventListener('change',()=>{applyPrecare();const cat=document.getElementById('treatmentCategory');if(cat)cat.textContent=treatmentCategory(treatment.value);generated=null;live()});live()}}
init();
</script>
